<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Next Chapter — A Working Guide to Independence</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE6;
    --paper-raised:#FBF9F3;
    --ink:#232A3B;
    --ink-soft:#565F72;
    --sage:#55705C;
    --sage-deep:#3E5744;
    --ochre:#B8863B;
    --rose:#A2564F;
    --line:#D8D2C2;
    --line-soft:#E7E2D4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--sage-deep);}

  /* Layout */
  .app{display:flex; min-height:100vh;}
  .rail{
    width:260px; flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--line);
    padding:28px 18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-title{
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 0 4px 4px;
  }
  .rail-name{
    font-family:'Fraunces',serif; font-size:22px; font-weight:600;
    margin:0 0 26px 4px; line-height:1.2;
  }
  .trail{position:relative; padding-left:28px;}
  .trail::before{
    content:""; position:absolute; left:9px; top:10px; bottom:10px; width:2px;
    background:linear-gradient(var(--line) 0%, var(--line) 100%);
  }
  .waypoint{
    position:relative; margin-bottom:4px;
  }
  .waypoint button{
    all:unset; display:block; width:100%; cursor:pointer;
    padding:10px 12px 10px 8px; border-radius:8px;
    font-size:14.5px; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .waypoint button:hover{background:var(--line-soft);}
  .waypoint.active button{background:var(--ink); color:var(--paper-raised); font-weight:600;}
  .waypoint-dot{
    position:absolute; left:-28px; top:14px; width:20px; height:20px; border-radius:50%;
    background:var(--paper-raised); border:2px solid var(--line); z-index:2;
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft);
  }
  .waypoint.done .waypoint-dot{background:var(--sage); border-color:var(--sage-deep); color:#fff;}
  .waypoint.active .waypoint-dot{border-color:var(--ink);}

  .rail-actions{margin-top:30px; padding-top:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  .rail-btn{
    all:unset; cursor:pointer; font-size:13px; color:var(--ink-soft);
    padding:8px 10px; border-radius:6px; text-align:left;
  }
  .rail-btn:hover{background:var(--line-soft); color:var(--ink);}
  .save-status{font-size:12px; color:var(--ink-soft); margin-top:14px; padding-left:10px; min-height:16px;}
  .storage-note{font-size:11.5px; color:var(--ink-soft); margin:2px 10px 0; line-height:1.4;}
  .rail-copyright{font-size:10.5px; color:var(--ink-soft); margin:20px 10px 0; line-height:1.4; opacity:.75;}

  .main{flex:1; padding:44px 56px 120px; max-width:880px;}
  .module{display:none;}
  .module.visible{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .module-eyebrow{font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--sage-deep); font-weight:600; margin-bottom:8px;}
  .module h1{font-size:34px; margin:0 0 10px;}
  .module-intro{color:var(--ink-soft); font-size:15.5px; max-width:60ch; margin-bottom:20px;}
  .framing-quote{
    font-family:'Fraunces',serif; font-style:italic; font-size:16.5px; color:var(--sage-deep);
    max-width:58ch; margin:0 0 32px; padding-left:16px; border-left:2px solid var(--sage);
  }

  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:26px 28px; margin-bottom:26px;
  }
  .card h2{font-size:19px; margin:0 0 6px;}
  .card-sub{color:var(--ink-soft); font-size:14px; margin:0 0 18px;}

  label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%; font-family:'Karla',sans-serif; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; margin-bottom:14px;
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--sage); outline-offset:1px; border-color:var(--sage);}
  textarea{resize:vertical; min-height:64px;}
  .row{display:flex; gap:14px;}
  .row > div{flex:1;}

  table{width:100%; border-collapse:collapse; margin-bottom:10px;}
  th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line);
  }
  td{padding:5px 6px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  td input, td textarea, td select{margin-bottom:0;}
  .del-row{all:unset; cursor:pointer; color:var(--rose); font-size:16px; padding:4px 8px;}
  .add-row{
    all:unset; cursor:pointer; font-size:13.5px; color:var(--sage-deep); font-weight:600;
    padding:8px 4px; display:inline-block; margin-top:4px;
  }
  .add-row:hover{text-decoration:underline;}

  .checklist{list-style:none; margin:0 0 14px; padding:0;}
  .checklist li{display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:15px;}
  .checklist input[type=checkbox]{margin-top:3px; width:16px; height:16px; accent-color:var(--sage);}

  .pill-toggle{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 14px;
    font-size:13px; cursor:pointer; color:var(--ink-soft); user-select:none;
  }
  .pill.on{background:var(--ink); border-color:var(--ink); color:var(--paper-raised);}

  .milestones{display:flex; gap:10px; margin:6px 0 20px; flex-wrap:wrap;}
  .milestone{
    flex:1; min-width:100px; border:1px solid var(--line); border-radius:10px; padding:12px;
    text-align:center; background:#fff;
  }
  .milestone.hit{background:var(--sage); border-color:var(--sage-deep); color:#fff;}
  .milestone .num{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
  .milestone .lbl{font-size:11.5px; color:inherit; opacity:.8;}
  .count-banner{font-family:'Fraunces',serif; font-size:15px; color:var(--ink-soft); margin-bottom:12px;}
  .count-banner b{color:var(--ink); font-size:17px;}

  .total-line{display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px solid var(--line); font-weight:600;}

  .note{
    border-left:3px solid var(--ochre); background:#fbf3e6; padding:12px 16px; border-radius:0 8px 8px 0;
    font-size:14px; color:#5a4523; margin-bottom:20px;
  }

  .nav-buttons{display:flex; justify-content:space-between; margin-top:36px;}
  .nav-buttons button{
    all:unset; cursor:pointer; font-size:14px; padding:10px 18px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink);
  }
  .nav-buttons button:hover{background:var(--line-soft);}

  .complete-toggle{
    display:flex; align-items:center; gap:10px; margin-top:8px; padding:14px 0 0;
    border-top:1px solid var(--line-soft); font-size:14px; color:var(--ink-soft);
  }
  .complete-toggle input{width:16px; height:16px; accent-color:var(--sage);}

  #printView, #weeklyView{ display:none; }

  @media print{
    .app{display:none !important;}
    body{background:#fff;}
    body:not(.print-mode-weekly) #printView{ display:block !important; padding: 0 30px; max-width:100%; }
    body.print-mode-weekly #printView{ display:none !important; }
    body.print-mode-weekly #weeklyView{ display:block !important; padding: 0 30px; max-width:100%; }
    body:not(.print-mode-weekly) #weeklyView{ display:none !important; }
    .pv-doc h1{font-size:22px; margin:0 0 4px;}
    .pv-doc h2{font-size:16px; margin:26px 0 8px; color:var(--sage-deep);}
    .pv-doc .pv-module{page-break-before:always;}
    .pv-doc .pv-module:first-child{page-break-before:auto;}
    .pv-doc .pv-field{margin-bottom:10px;}
    .pv-doc .pv-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; margin-bottom:2px;}
    .pv-doc .pv-value{white-space:pre-wrap; font-size:14px; line-height:1.5;}
    .pv-doc table{width:100%; border-collapse:collapse; margin-bottom:14px;}
    .pv-doc th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid #999; padding:4px 6px;}
    .pv-doc td{font-size:13px; border-bottom:1px solid #ddd; padding:6px; vertical-align:top; white-space:pre-wrap;}
    .pv-doc ul.pv-check{list-style:none; padding:0; margin:0 0 14px;}
    .pv-doc ul.pv-check li{font-size:14.5px; padding:5px 0;}
    .pv-doc .pv-empty{color:var(--ink-soft); font-size:13px; font-style:italic;}
    .pv-doc .pv-notes-box{border:1px solid #ccc; min-height:180px; border-radius:6px;}
    .pv-doc .pv-tracker{width:100%; border-collapse:collapse; margin-bottom:16px;}
    .pv-doc .pv-tracker th{font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid #999; padding:5px 4px; text-align:center;}
    .pv-doc .pv-tracker th:first-child{text-align:left;}
    .pv-doc .pv-tracker td{font-size:13px; border-bottom:1px solid #ddd; padding:7px 4px; text-align:center;}
    .pv-doc .pv-tracker td:first-child{text-align:left; padding-right:10px;}
    .pv-doc .pv-doc-sub{font-size:13px; color:var(--ink-soft); margin:0 0 10px;}
    .pv-doc .pv-tracker-label{font-weight:600; font-size:13.5px; margin:16px 0 6px;}
    .pv-doc .pv-tracker-list{list-style:none; padding:0; margin:0 0 4px; columns:2; column-gap:30px;}
    .pv-doc .pv-tracker-list li{font-size:13.5px; padding:5px 0; break-inside:avoid;}
  }

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .rail{position:relative; width:100%; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    .trail{display:flex; overflow-x:auto; padding-left:8px; gap:4px;}
    .trail::before{display:none;}
    .waypoint-dot{position:static; margin-right:6px;}
    .waypoint button{display:flex; align-items:center; white-space:nowrap;}
    .main{padding:28px 20px 100px;}
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail">
    <p class="rail-title">A working guide</p>
    <p class="rail-name">The Next Chapter</p>
    <div class="trail" id="trail"></div>
    <div class="rail-actions">
      <button class="rail-btn" onclick="printWorkbook()">↓ Print / Save as PDF</button>
      <button class="rail-btn" onclick="printWeeklyGuide()">📋 Weekly Guide (PDF)</button>
      <button class="rail-btn" onclick="exportData()">⬇ Download a backup file</button>
      <button class="rail-btn" onclick="document.getElementById('importFile').click()">⬆ Load a backup file</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this.files[0])">
      <button class="rail-btn" onclick="resetAll()">↺ Clear my answers</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <p class="storage-note" id="storageNote"></p>
    <p class="rail-copyright">© 2026 Brandon Reeves, LCSW. For personal and family use only — not for resale or redistribution.</p>
  </nav>

  <main class="main" id="main"></main>
</div>

<div id="printView" class="pv-doc"></div>
<div id="weeklyView" class="pv-doc"></div>

<script>
const MODULES = [
  {id:"foundation", label:"0 · Foundation"},
  {id:"financial", label:"1 · Money & Logistics"},
  {id:"career", label:"2 · Career & Search"},
  {id:"emotional", label:"3 · Resilience"},
  {id:"progress", label:"4 · Progress & Wins"},
  {id:"household", label:"5 · Household & Skills"},
  {id:"relational", label:"6 · Staying Connected"},
  {id:"aftermove", label:"7 · After the Move"},
];

function defaultState(){
  return {
    moduleComplete: {},
    foundation: {
      why:"",
      situation: {support:'', timeline:'', considerations: []},
      agreement: [], goalNow:"", goalReady:"", targetDate:"",
      planB: {ifNot:'', checkinDate:''}
    },
    financial: {costs: [], income:"", currentSavings:"", moveInCosts: [], cushionMonths:"3", cushionCustom:"", literacy:{}},
    career: {industries: [], applications: [], rejections: [], checklist:{}, successType:'', milestoneReflections:{}, milestoneMarks:{}, wins: [], weeklyAppGoal:'', weeklyNetworkGoal:''},
    household: {routine: [], moveOut:{}},
    emotional: {reflections:{}},
    progress: {lifeWins: [], reflections:{proud:'', working:'', easier:''}},
    relational: {checkins: [], scripts:{}},
    aftermove: {checkins: [], notes:{}, taper: []}
  };
}
let state = defaultState();

let current = "foundation";
let saveTimer = null;
const STORAGE_KEY = 'the-next-chapter-workbook';

function storageIsAvailable(){
  try{
    const t = '__test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const STORAGE_OK = storageIsAvailable();

function uid(){ return Math.random().toString(36).slice(2,9); }

function mergeWithDefaults(loaded){
  const defaults = defaultState();
  const merged = {};
  Object.keys(defaults).forEach(key=>{
    if(loaded && Object.prototype.hasOwnProperty.call(loaded, key)){
      merged[key] = Object.assign({}, defaults[key], loaded[key]);
    } else {
      merged[key] = defaults[key];
    }
  });
  return merged;
}

function loadState(){
  const noteEl = document.getElementById('storageNote');
  if(STORAGE_OK){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const loaded = JSON.parse(raw);
        state = mergeWithDefaults(loaded);
      }
      if(noteEl) noteEl.textContent = "Saves automatically in this browser. Download a backup file if you'll switch devices or clear browser data.";
    }catch(e){
      if(noteEl) noteEl.textContent = "Couldn't read saved progress — starting fresh. Your work still auto-saves from here.";
    }
  } else {
    if(noteEl) noteEl.textContent = "This browser/preview can't auto-save. Download a backup file often, or open this file directly in a normal browser tab to enable auto-save.";
  }
  render();
}

function queueSave(){
  const el = document.getElementById('saveStatus');
  if(!STORAGE_OK){
    if(el) el.textContent = "Not auto-saving here — download a backup to keep your work";
    return;
  }
  if(el) el.textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(el) el.textContent = "Saved just now, in this browser";
    }catch(e){
      if(el) el.textContent = "Couldn't save — download a backup to keep your work";
    }
  }, 400);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `next-chapter-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const loaded = JSON.parse(e.target.result);
      if(!confirm("This replaces your current answers with the backup file. Continue?")) return;
      state = mergeWithDefaults(loaded);
      queueSave();
      render();
    }catch(err){
      alert("That file doesn't look like a valid backup. Nothing was changed.");
    }
  };
  reader.readAsText(file);
}

function resetAll(){
  if(!confirm("This clears everything you've filled in. Continue?")) return;
  if(STORAGE_OK){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }
  state = defaultState();
  queueSave();
  render();
}

function renderTrail(){
  const trail = document.getElementById('trail');
  trail.innerHTML = MODULES.map((m,i)=>`
    <div class="waypoint ${current===m.id?'active':''} ${state.moduleComplete[m.id]?'done':''}">
      <div class="waypoint-dot">${state.moduleComplete[m.id] ? '✓' : i}</div>
      <button onclick="goTo('${m.id}')">${m.label}</button>
    </div>
  `).join('');
}

function goTo(id){
  current = id;
  render();
  document.getElementById('main').scrollTo(0,0);
  window.scrollTo(0,0);
}

function completeToggle(moduleId){
  return `<div class="complete-toggle">
    <input type="checkbox" ${state.moduleComplete[moduleId]?'checked':''} onchange="state.moduleComplete['${moduleId}']=this.checked; queueSave(); renderTrail();">
    <span>Mark this section as done for now — you can always come back.</span>
  </div>`;
}

function navButtons(){
  const i = MODULES.findIndex(m=>m.id===current);
  const prev = MODULES[i-1], next = MODULES[i+1];
  return `<div class="nav-buttons">
    <button ${!prev?'style="visibility:hidden"':''} onclick="goTo('${prev?prev.id:''}')">← ${prev?prev.label:''}</button>
    <button ${!next?'style="visibility:hidden"':''} onclick="goTo('${next?next.id:''}')">${next?next.label:''} →</button>
  </div>`;
}

// ---------- FOUNDATION ----------
const SUPPORT_OPTIONS = ["Full financial support","Partial support","Minimal support","Fully self-funding"];
const TIMELINE_OPTIONS = ["Working toward a target date","Open-ended, no fixed date","Extended time at home is the plan, not a problem"];
const CONSIDERATION_OPTIONS = ["Neurodivergence or a learning difference","Chronic illness or ongoing health need","Mental health considerations","Single-parent or one-income household","Cultural expectation of extended time at home","Other"];

function setSupport(v){ state.foundation.situation.support = v; queueSave(); render(); }
function setTimeline(v){ state.foundation.situation.timeline = v; queueSave(); render(); }
function toggleConsideration(v){
  const arr = state.foundation.situation.considerations;
  const i = arr.indexOf(v);
  if(i>-1) arr.splice(i,1); else arr.push(v);
  queueSave(); render();
}

function situationNote(){
  const s = state.foundation.situation;
  const notes = [];
  if(s.support==="Minimal support" || s.support==="Fully self-funding"){
    notes.push("The Money module ahead is built assuming some family support — skim it and use only what's relevant to your situation.");
  }
  if(s.timeline==="Extended time at home is the plan, not a problem"){
    notes.push("Target dates elsewhere in this workbook are optional for you — treat them as milestones to notice, not deadlines to hit.");
  }
  if(s.considerations.includes("Neurodivergence or a learning difference") || s.considerations.includes("Chronic illness or ongoing health need")){
    notes.push("Pacing matters more than speed here — adjust every module's timeline to fit what's realistic, not what's typical.");
  }
  return notes.length ? `<div class="note">${notes.join('<br><br>')}</div>` : '';
}

function renderFoundation(){
  const a = state.foundation;
  const s = a.situation;
  return `
  <p class="module-eyebrow">Module 0</p>
  <h1>Foundation</h1>
  <p class="module-intro">Before the checklists and trackers, get clear on why this matters and what everyone's agreeing to. This module works best filled out together.</p>
  <p class="framing-quote">"Every time you're tempted to fix something for them, ask: is this building their self-trust, or quietly telling them I don't think they can do it themselves?"</p>

  <div class="card">
    <h2>Your situation</h2>
    <p class="card-sub">This isn't a form to get "right" — it just tells the rest of the workbook how to adapt to what's actually true for you.</p>
    <label>Financial support available right now</label>
    <div class="pill-toggle">${SUPPORT_OPTIONS.map(o=>`<span class="pill ${s.support===o?'on':''}" onclick="setSupport('${o}')">${o}</span>`).join('')}</div>
    <label>Timeline</label>
    <div class="pill-toggle">${TIMELINE_OPTIONS.map(o=>`<span class="pill ${s.timeline===o?'on':''}" onclick="setTimeline('${o}')">${o}</span>`).join('')}</div>
    <label>Anything else shaping the pace of this</label>
    <div class="pill-toggle">${CONSIDERATION_OPTIONS.map(o=>`<span class="pill ${s.considerations.includes(o)?'on':''}" onclick="toggleConsideration('${o}')">${o}</span>`).join('')}</div>
    ${situationNote()}
  </div>

  <div class="card">
    <h2>Why this, why now</h2>
    <p class="card-sub">A few honest sentences — from whoever is guiding this, and from the person moving toward independence — about why this chapter matters.</p>
    <label>In our own words</label>
    <textarea oninput="state.foundation.why=this.value; queueSave();" placeholder="e.g. We're doing this because...">${a.why}</textarea>
  </div>

  <div class="card">
    <h2>Where we are → where we're headed</h2>
    <div class="row">
      <div><label>Right now, things look like...</label><textarea oninput="state.foundation.goalNow=this.value; queueSave();">${a.goalNow}</textarea></div>
      <div><label>"Ready" will look like...</label><textarea oninput="state.foundation.goalReady=this.value; queueSave();">${a.goalReady}</textarea></div>
    </div>
    <label>Rough target date (it's okay to guess)</label>
    <input type="text" value="${a.targetDate}" oninput="state.foundation.targetDate=this.value; queueSave();" placeholder="e.g. End of this year, or 'no fixed date yet'">
  </div>

  <div class="card">
    <h2>Support Agreement</h2>
    <p class="card-sub">List what's currently being covered, by whom, and what — if anything — is expected in return. There's no required "right" model here; different families land in different places, and this is meant to be renegotiated as things change.</p>

function renderCushionPills(){

  const opts = [["1","1 month"],["3","3 months"],["6","6 months"],["custom","Custom"]];
  el.innerHTML = opts.map(([v,label])=>`<span class="pill ${state.financial.cushionMonths===v?'on':''}" onclick="setCushion('${v}')">${label}</span>`).join('');
  if(state.financial.cushionMonths==="custom"){
    wrap.innerHTML = `<label>Custom number of months</label><input type="number" value="${state.financial.cushionCustom}" oninput="state.financial.cushionCustom=this.value; queueSave(); renderBudgetSummary();" placeholder="e.g. 4" style="max-width:140px;">`;
  } else {

  }

function renderBudgetSummary(){
  const f = state.financial;
  const monthlyTotal = f.costs.reduce((s,c)=>s + (parseFloat(c.amount)||0), 0);
  const moveInTotal = f.moveInCosts.reduce((s,m)=>s + (parseFloat(m.amount)||0), 0);
  const cushionMonthsVal = f.cushionMonths==="custom" ? (parseFloat(f.cushionCustom)||0) : parseFloat(f.cushionMonths||0);
  const cushionAmount = monthlyTotal * cushionMonthsVal;
  const savingsGoalTotal = moveInTotal + cushionAmount;
  const currentSavings = parseFloat(f.currentSavings)||0;
  const income = parseFloat(f.income)||0;
  const surplus = income - monthlyTotal;
  const stillNeeded = Math.max(savingsGoalTotal - currentSavings, 0);
  const monthsToGoal = surplus > 0 && stillNeeded > 0 ? Math.ceil(stillNeeded / surplus) : null;

  const moveInEl = document.getElementById('moveInTotalDisplay');
  if(moveInEl) moveInEl.textContent = '$' + moveInTotal.toFixed(2);

  let surplusLine;
  if(income === 0){
    surplusLine = `<span style="color:var(--ink-soft)">Add expected income above to see whether it covers your monthly costs.</span>`;
  } else if(surplus >= 0){
    surplusLine = `Monthly income covers costs with <b>$${surplus.toFixed(2)}</b> left over each month.`;
  } else {
    surplusLine = `<span style="color:var(--rose)">Monthly income falls <b>$${Math.abs(surplus).toFixed(2)} short</b> of covering costs — worth revisiting income, costs, or the timeline before locking in a move date.</span>`;
  }

  let goalLine;
  if(monthsToGoal){
    goalLine = `At this rate, reaching your full savings target takes about <b>${monthsToGoal} month${monthsToGoal===1?'':'s'}</b> of saving the full surplus.`;
  } else if(stillNeeded === 0){
    goalLine = `Current savings already cover the target — nice work.`;
  } else {
    goalLine = `Add an expected income above to estimate how long reaching this target will take.`;
  }

  const el = document.getElementById('budgetSummary');
  if(!el) return;
  el.innerHTML = `
    <div class="total-line"><span>Monthly cost of living (from above)</span><span class="mono">$${monthlyTotal.toFixed(2)}</span></div>
    <div class="total-line"><span>+ One-time move-in costs</span><span class="mono">$${moveInTotal.toFixed(2)}</span></div>
    <div class="total-line"><span>+ Safety cushion (${cushionMonthsVal || 0} mo. × monthly cost)</span><span class="mono">$${cushionAmount.toFixed(2)}</span></div>
    <div class="total-line" style="font-size:16px;"><span>= Total savings target before moving</span><span class="mono">$${savingsGoalTotal.toFixed(2)}</span></div>
    <div class="total-line"><span>− Current savings</span><span class="mono">$${currentSavings.toFixed(2)}</span></div>
    <div class="total-line" style="font-size:16px; border-top:2px solid var(--ink);"><span>Still needed</span><span class="mono">$${stillNeeded.toFixed(2)}</span></div>
    <p style="margin:16px 0 4px; font-size:14.5px;">${surplusLine}</p>
    <p style="margin:0; font-size:14.5px;">${goalLine}</p>
  `;
}

// ---------- STATIC PRINT VIEW ----------
// Textareas and inputs clip their own content when printed directly (they only
// show what's visible in the box, not the full value). So instead of printing
// the live form, we build a plain, static document straight from `state` —
// every value becomes wrapping text with no fixed-height container to clip it.

function esc(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pvField(label, value){
  const v = (value||'').toString().trim();
  return `<div class="pv-field"><div class="pv-label">${esc(label)}</div><div class="pv-value">${v ? esc(v) : '<span class="pv-empty">Not filled in</span>'}</div></div>`;
}
function pvTable(headers, rows, nowrapCols){
  nowrapCols = nowrapCols || [];
  if(!rows.length) return `<p class="pv-empty">Nothing logged yet.</p>`;
  return `<table><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td${nowrapCols.includes(i)?' style="white-space:nowrap"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')
  }</table>`;
}
function pvChecklist(items, checkedFn){
  return `<ul class="pv-check">${items.map((item,i)=>`<li>${checkedFn(i)?'☑':'☐'} ${esc(item)}</li>`).join('')}</ul>`;
}
function pvDate(value){
  if(!value) return '';
  const parts = String(value).split('-');
  if(parts.length !== 3) return value;
  const [y,m,d] = parts;
  return `${m}/${d}/${y}`;
}
function resolveOther(value, customValue, otherLabel){
  return value===otherLabel ? (customValue || '(not specified)') : (value || '');
}

function buildPrintView(){
  const st = state;
  const f = st.foundation, fin = st.financial, c = st.career, h = st.household, e = st.emotional, pr = st.progress, r = st.relational, am = st.aftermove;
  const otherArea = "Other (type your own)";

  let html = `<h1 style="text-align:center; font-size:28px;">The Next Chapter</h1>
  <p style="text-align:center; color:var(--ink-soft); margin-bottom:30px;">Printed ${new Date().toLocaleDateString()}</p>`;

  // Foundation
  html += `<div class="pv-module"><h1>Module 0 — Foundation</h1>`;
  html += `<h2>Your situation</h2>`;
  html += pvField("Financial support available right now", f.situation.support);
  html += pvField("Timeline", f.situation.timeline);
  html += pvField("Anything else shaping the pace of this", (f.situation.considerations||[]).join(", "));
  html += `<h2>Why this, why now</h2>`;
  html += pvField("In our own words", f.why);
  html += `<h2>Where we are → where we're headed</h2>`;
  html += pvField("Right now, things look like...", f.goalNow);
  html += pvField('"Ready" will look like...', f.goalReady);
  html += pvField("Rough target date (it's okay to guess)", f.targetDate);
  html += `<h2>Support Agreement</h2>`;
  html += pvTable(["Area","Currently covered by","What's expected in return"], f.agreement.map(a=>[resolveOther(a.area,a.areaCustom,otherArea), a.coveredBy, a.expected]));
  html += `<h2>Plan B</h2>`;
  html += pvField("If we haven't hit the goal by the target date, then...", f.planB.ifNot);
  html += pvField("Revisit date", pvDate(f.planB.checkinDate));
  html += `</div>`;

  // Financial
  const totalCost = fin.costs.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const moveInTotal = fin.moveInCosts.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const cushionMonthsVal = fin.cushionMonths==="custom" ? (parseFloat(fin.cushionCustom)||0) : parseFloat(fin.cushionMonths||0);
  const cushionAmount = totalCost * cushionMonthsVal;
  const goalTotal = moveInTotal + cushionAmount;
  const stillNeeded = Math.max(goalTotal - (parseFloat(fin.currentSavings)||0), 0);
  html += `<div class="pv-module"><h1>Module 1 — Money &amp; Logistics</h1>`;
  html += `<h2>Financial literacy basics</h2>`;
  html += pvChecklist(LITERACY_ITEMS, i=>!!fin.literacy[i]);
  html += `<h2>Real cost of living, on your own</h2>`;
  html += pvTable(["Category","Monthly estimate","Notes"], fin.costs.map(cc=>[resolveOther(cc.category,cc.categoryCustom,otherArea), cc.amount ? '$'+cc.amount : '', cc.notes]), [1]);
  html += pvField("Estimated monthly total", '$'+totalCost.toFixed(2));
  html += `<h2>Move-In &amp; Savings Plan</h2>`;
  html += pvTable(["Item","Estimated cost"], fin.moveInCosts.map(m=>[resolveOther(m.item,m.itemCustom,otherArea), m.amount ? '$'+m.amount : '']), [1]);
  html += pvField("One-time move-in total", '$'+moveInTotal.toFixed(2));
  html += pvField("Safety cushion", cushionMonthsVal + " months × monthly cost = $" + cushionAmount.toFixed(2));
  html += pvField("Total savings target before moving", '$'+goalTotal.toFixed(2));
  html += pvField("Current savings", fin.currentSavings ? '$'+fin.currentSavings : '');
  html += pvField("Still needed", '$'+stillNeeded.toFixed(2));
  html += pvField("Expected monthly income once working", fin.income ? '$'+fin.income : '');
  html += `</div>`;

  // Career
  html += `<div class="pv-module"><h1>Module 2 — Career &amp; Search</h1>`;
  html += pvField('What does "success" look like right now', c.successType);
  html += `<h2>Industries &amp; roles of interest</h2>`;
  html += pvTable(["Industry / role","Why it matters to me"], c.industries.map(x=>[x.name,x.why]));
  html += `<h2>Resume check</h2>`;
  html += pvChecklist(RESUME_ITEMS, i=>!!c.checklist['r'+i]);
  html += `<h2>Cover letter check</h2>`;
  html += pvChecklist(COVER_ITEMS, i=>!!c.checklist['c'+i]);
  html += `<h2>Applications</h2>`;
  html += pvTable(["Position","Org","Date","Status"], c.applications.map(x=>[x.position,x.org,pvDate(x.date),x.status]), [2,3]);
  html += `<h2>Wins along the way</h2>`;
  html += pvTable(["Date","Category","What happened"], c.wins.map(x=>[pvDate(x.date),x.category,x.description]), [0,1]);
  html += `<h2>The 100 No's Project — ${c.rejections.length} logged</h2>`;
  html += pvTable(["Position / Org","What I learned","What I'll try differently"], c.rejections.map(x=>[x.role,x.learned,x.different]));
  MILESTONES.forEach(m=>{
    const reached = c.rejections.length >= m.n;
    html += `<div class="pv-field"><div class="pv-label">Milestone ${m.n} — ${esc(m.label)}${reached ? ' (reached)' : ''}</div>`;
    if(c.milestoneMarks[m.n]) html += `<div class="pv-value">How we'll mark it: ${esc(c.milestoneMarks[m.n])}</div>`;
    if(reached) html += `<div class="pv-value" style="margin-top:4px;">${esc(c.milestoneReflections[m.n]||'(reflection not filled in yet)')}</div>`;
    html += `</div>`;
  });
  html += `</div>`;

  // Resilience
  html += `<div class="pv-module"><h1>Module 3 — Resilience</h1>`;
  REFLECTION_PROMPTS.forEach(p=>{ html += pvField(p.q, e.reflections[p.key]); });
  html += `</div>`;

  // Progress & Wins
  const stats = progressStats();
  html += `<div class="pv-module"><h1>Module 4 — Progress &amp; Wins</h1>`;
  html += `<h2>Where things stand</h2>`;
  html += pvField("Applications sent", stats.applications);
  html += pvField("Interviews / offers", stats.interviews);
  html += pvField("Wins logged", stats.careerWins);
  html += pvField("No's collected", stats.rejections);
  html += pvField("100 No's milestones reached", stats.milestonesReached + "/5");
  html += pvField("Routine tasks built", stats.routineTasks);
  html += pvField("Move-out readiness", stats.moveOutPct + "%");
  html += pvField("Modules marked done", stats.modulesComplete + "/" + MODULES.length);
  html += `<h2>Wins beyond the job search</h2>`;
  html += pvTable(["Date","Area","What happened"], pr.lifeWins.map(x=>[pvDate(x.date),x.area,x.description]), [0,1]);
  html += `<h2>Take stock</h2>`;
  html += pvField("What's working right now that wasn't a few months ago?", pr.reflections.working);
  html += pvField("What am I proud of, even if it's small?", pr.reflections.proud);
  html += pvField("What's becoming easier, even if it's still hard?", pr.reflections.easier);
  html += `</div>`;

  // Household
  html += `<div class="pv-module"><h1>Module 5 — Household &amp; Life Skills</h1>`;
  html += `<h2>My routine</h2>`;
  html += pvTable(["Task","How often"], h.routine.map(x=>[resolveOther(x.task,x.taskCustom,otherArea), x.freq]), [1]);
  html += `<h2>Move-out readiness</h2>`;
  html += pvChecklist(MOVEOUT_ITEMS, i=>!!h.moveOut[i]);
  html += `</div>`;

  // Staying Connected
  html += `<div class="pv-module"><h1>Module 6 — Staying Connected</h1>`;
  html += `<h2>Weekly check-in</h2>`;
  html += pvTable(["Week of","Their win / challenge","My win / challenge","One thing to try next week"], r.checkins.map(x=>[x.week,x.theirs,x.mine,x.next]));
  html += `<h2>An outside voice</h2>`;
  html += pvField("Who, and what they're good for", r.scripts.who);
  html += pvField('How I\'ll ask for help (a specific ask beats "I don\'t know what to do")', r.scripts.ask);
  html += `</div>`;

  // After the Move
  html += `<div class="pv-module"><h1>Module 7 — After the Move</h1>`;
  html += `<h2>Support Taper Plan</h2>`;
  html += pvTable(["Category","Support right after moving","Plan to taper it down","Target date for full independence"], am.taper.map(x=>[resolveOther(x.area,x.areaCustom,otherArea), x.current, x.plan, pvDate(x.targetDate)]), [3]);
  html += `<h2>First few months</h2>`;
  html += pvTable(["Month","What's working","What's hard"], am.checkins.map(x=>[x.month,x.working,x.hard]));
  html += `<h2>If we need a way back</h2>`;
  html += pvField("What a temporary return or extra support would look like, if it's ever needed", am.notes.wayBack);
  html += `</div>`;

  html += `<p style="text-align:center; color:var(--ink-soft); font-size:11px; margin-top:40px; opacity:.75;">© 2026 Brandon Reeves, LCSW. For personal and family use only — not for resale or redistribution.</p>`;

  document.getElementById('printView').innerHTML = html;
}

// ---------- WEEKLY GUIDE (separate document) ----------
function buildWeeklyView(){
  const c = state.career, h = state.household;
  const dailyTasks = h.routine.filter(r => r.freq === "Daily");
  const weeklyTasks = h.routine.filter(r => r.freq === "Weekly");
  const monthlyTasks = h.routine.filter(r => r.freq === "Monthly");
  const otherArea = "Other (type your own)";
  const taskLabel = r => resolveOther(r.task, r.taskCustom, otherArea);
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  const industries = c.industries.map(x => x.name).filter(Boolean);
  const clampGoal = v => Math.min(Math.max(parseInt(v) || 0, 1), 30);
  const appGoal = clampGoal(c.weeklyAppGoal || 5);
  const networkGoal = clampGoal(c.weeklyNetworkGoal || 1);
  const resumeRemaining = RESUME_ITEMS.filter((_,i) => !c.checklist['r'+i]);
  const coverRemaining = COVER_ITEMS.filter((_,i) => !c.checklist['c'+i]);

  function simpleChecklist(title, items){
    if(!items.length) return `<h2>${esc(title)}</h2><p class="pv-empty">Nothing set up here yet.</p>`;
    return `<h2>${esc(title)}</h2><ul class="pv-check">${items.map(t=>`<li>☐ ${esc(t)}</li>`).join('')}</ul>`;
  }
  function trackerLines(count){
    return `<ul class="pv-tracker-list">${Array.from({length: count}).map((_,i)=>
      `<li>☐ ${i+1}. ________________________________________</li>`).join('')}</ul>`;
  }

  let html = `<h1 style="text-align:center; font-size:26px;">Weekly Guide</h1>
  <p style="text-align:center; color:var(--ink-soft); margin-bottom:26px;">Week of: ______________________</p>`;

  // Daily tasks as a real day-by-day tracker, not a one-off checkbox
  html += `<h2>Household — Every Day</h2>`;
  if(dailyTasks.length){
    html += `<table class="pv-tracker"><tr><th>Task</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>`;
    html += dailyTasks.map(r => `<tr><td>${esc(taskLabel(r))}</td>${DAYS.map(()=>`<td>☐</td>`).join('')}</tr>`).join('');
    html += `</table>`;
  } else {
    html += `<p class="pv-empty">No daily tasks set up yet — add some in the Household module.</p>`;
  }

  html += simpleChecklist("Household — This Week", weeklyTasks.map(taskLabel));
  if(monthlyTasks.length) html += simpleChecklist("Household — Also This Month, If Due", monthlyTasks.map(taskLabel));

  // Career — an actual number of checkboxes to fill in as they happen, not a summary line
  html += `<h2>Career — This Week's Targets</h2>`;
  if(industries.length) html += `<p class="pv-doc-sub">Focus areas: ${esc(industries.slice(0,4).join(', '))}</p>`;

  html += `<p class="pv-tracker-label">Applications — goal: ${appGoal}</p>`;
  html += trackerLines(appGoal);

  html += `<p class="pv-tracker-label">Networking conversations — goal: ${networkGoal}</p>`;
  html += trackerLines(networkGoal);

  if(resumeRemaining.length){
    html += `<p class="pv-tracker-label">Resume — still to do</p>`;
    html += `<ul class="pv-check">${resumeRemaining.map(t=>`<li>☐ ${esc(t)}</li>`).join('')}</ul>`;
  }
  if(coverRemaining.length){
    html += `<p class="pv-tracker-label">Cover letter — still to do</p>`;
    html += `<ul class="pv-check">${coverRemaining.map(t=>`<li>☐ ${esc(t)}</li>`).join('')}</ul>`;
  }

  html += `<h2>Notes, Follow-Ups &amp; Wins</h2>`;
  html += `<p class="pv-doc-sub">Don't just log what went wrong or what's still pending — jot down the wins too as they happen: a good response, an interview scheduled, a conversation that went well, anything that felt like progress. It's easy to forget these by the weekly review if they're not written down in the moment.</p>`;
  html += `<div class="pv-notes-box"></div>`;

  html += `<p style="text-align:center; color:var(--ink-soft); font-size:11px; margin-top:40px; opacity:.75;">© 2026 Brandon Reeves, LCSW. For personal and family use only — not for resale or redistribution.</p>`;

  document.getElementById('weeklyView').innerHTML = html;
}

let activePrintMode = 'full';
const ORIGINAL_TITLE = document.title;

function printWorkbook(){
  activePrintMode = 'full';
  document.body.classList.remove('print-mode-weekly');
  document.title = 'The Next Chapter - Full Workbook';
  buildPrintView();
  window.print();
}
function printWeeklyGuide(){
  activePrintMode = 'weekly';
  document.body.classList.add('print-mode-weekly');
  const stamp = new Date().toISOString().slice(0,10);
  document.title = 'The Next Chapter - Weekly Guide - ' + stamp;
  buildWeeklyView();
  window.print();
}
window.addEventListener('beforeprint', ()=>{
  if(activePrintMode === 'weekly') buildWeeklyView(); else buildPrintView();
});
window.addEventListener('afterprint', ()=>{
  activePrintMode = 'full';
  document.body.classList.remove('print-mode-weekly');
  document.title = ORIGINAL_TITLE;
});

loadState();
</script>
