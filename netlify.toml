# Netlify Configuration for Greenpath Wellness

[build]
  publish = "."

[[redirects]]
  from = "/ai-website-compliance-checklist"
  to = "/ai-website-compliance-checklist.html"
  status = 200

[[redirects]]
  from = "/checklist-thank-you"
  to = "/checklist-thank-you.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
